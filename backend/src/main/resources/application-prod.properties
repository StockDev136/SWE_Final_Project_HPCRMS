# Activated on Railway via the SPRING_PROFILES_ACTIVE=prod environment
# variable. Nothing here is hardcoded — every value comes from the
# environment, set in Railway's dashboard, never committed to Git.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Railway assigns the port dynamically via $PORT — the app must bind to
# whatever it provides, not a fixed 8080.
server.port=${PORT:8080}

# Railway terminates HTTPS at its edge and forwards to this app over plain
# HTTP internally. Without this, Spring Boot only sees that internal HTTP
# hop and has no idea the real external request was HTTPS — which makes
# Springdoc generate http:// URLs for itself, and Swagger UI's "Try it out"
# then gets blocked as mixed content on an HTTPS page. This tells Spring
# Boot to trust the X-Forwarded-Proto header Railway sends and report the
# scheme correctly.
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

# Comma-separated list, read by SecurityConfig's CORS bean. Set this to your
# real Vercel URL(s) once you have them — e.g.
# https://your-project.vercel.app,https://your-project-git-main-you.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
